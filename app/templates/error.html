{% extends "base.html" %}
{% block title %}{{ error_title }} · 在线问卷系统{% endblock %}
{% block main_class %}workspace-page error-page{% endblock %}
{% block content %}
  <section class="error-panel" role="alert">
    <span class="error-panel-mark" aria-hidden="true">!</span>
    <h1>{{ error_title }}</h1>
    <p>{{ error_message }}</p>
    <div class="error-panel-actions">
      <button type="button" class="secondary-button" onclick="window.location.reload()">重新加载</button>
      <a class="primary-link" href="{{ url_for('auth.dashboard') if g.user else url_for('index') }}">{{ '返回个人首页' if g.user else '返回首页' }}</a>
    </div>
  </section>
{% endblock %}
