server {
    listen 80;
    server_name 119.28.27.184;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/survey-phase1-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name 119.28.27.184;
    ssl_certificate /etc/letsencrypt-survey-prod/live/119.28.27.184/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-survey-prod/live/119.28.27.184/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/survey-phase1-acme;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
