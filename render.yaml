services:
  - type: web
    name: survey-phase1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: survey_phase1
      - key: SECRET_KEY
        generateValue: true
